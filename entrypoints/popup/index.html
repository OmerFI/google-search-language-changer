<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Google Search Language Changer</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <header>
      <h1 data-i18n="popupHeaderText">Google Search Language Changer</h1>
    </header>
    <main>
      <div class="wrapper">
        <div class="flex-container">
          <div class="interface">
            <p class="content-title" data-i18n="popupInterfaceLanguageText">
              Web Arayüz Dili:
            </p>
            <div class="flex-container-2">
              <div class="button-container">
                <button
                  type="button"
                  class="english"
                  data-param="hl"
                  data-language="en"
                  data-i18n="popupLanguageButton1Text"
                >
                  English
                </button>
                <button
                  type="button"
                  class="turkish"
                  data-param="hl"
                  data-language="tr"
                  data-i18n="popupLanguageButton2Text"
                >
                  Türkçe
                </button>
              </div>
              <i class="fa fa-refresh restart" data-reset="hl"></i>
            </div>
          </div>
          <div class="specified-language">
            <p class="content-title" data-i18n="popupSpecifiedLanguageText">
              Pages In Specified Language:
            </p>
            <div class="flex-container-2">
              <div class="button-container">
                <button
                  type="button"
                  class="english"
                  data-param="lr"
                  data-language="en"
                  data-i18n="popupLanguageButton1Text"
                >
                  English
                </button>
                <button
                  type="button"
                  class="turkish"
                  data-param="lr"
                  data-language="tr"
                  data-i18n="popupLanguageButton2Text"
                >
                  Türkçe
                </button>
              </div>

              <i
                class="fa fa-refresh restart"
                data-reset="lr"
              ></i>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
