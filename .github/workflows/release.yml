name: Release

on:
  push:
    tags: ["v*"]
  # Elle tetiklendiğinde mağazalara bir şey yüklenmez, yalnızca kimlik bilgileri denenir.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        if: github.event_name == 'push'
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: pnpm zip
      - run: pnpm zip:firefox
      - run: pnpm lint:firefox
      - name: Submit to Chrome Web Store and Firefox Add-ons
        run: >-
          pnpm exec wxt submit
          ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
          --chrome-zip .output/*-chrome.zip
          --firefox-zip .output/*-firefox.zip
          --firefox-sources-zip .output/*-sources.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: nklmaonpgdnlhmkppobhjeddgmmfdpmm
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: "{6fb0f31f-0a75-4b37-8db8-80c6fc8e3ff4}"
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      - name: Create GitHub release
        if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" .output/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
